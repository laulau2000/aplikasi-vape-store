<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penawaran</title>
<meta id="metaDesc" name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --primary: #dc2626;
        --primary-dark: #b91c1c;
        --primary-soft: #fef2f2;
        --blue: #2563eb;
        --blue-soft: #eff6ff;
        --amber: #d97706;
        --amber-soft: #fffbeb;
        --purple: #7c3aed;
        --purple-soft: #f5f3ff;
        --bg: #f4f6f8;
        --card: #ffffff;
        --border: #e8ebef;
        --text: #1e293b;
        --text-muted: #64748b;
        --radius: 20px;
        --radius-sm: 12px;
        --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
        --shadow-lg: 0 18px 48px rgba(16,24,40,.14);
        --ease-ios: cubic-bezier(.32,.72,0,1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { margin: 0; line-height: 1.2; font-weight: 800; letter-spacing: -.02em; }
    p { margin: 0; }
    a { color: inherit; text-decoration: none; }

    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 22px; }

    /* ---------- Topbar ---------- */
    .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255,255,255,.78);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
    }
    .topbar__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 66px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand__logo {
        width: 40px; height: 40px;
        border-radius: 12px;
        display: grid; place-items: center;
        background: var(--primary);
        color: #fff;
        font-weight: 900;
        font-size: 15px;
        letter-spacing: .5px;
        box-shadow: 0 6px 16px rgba(220,38,38,.35);
    }
    .brand__text { display: flex; flex-direction: column; }
    .brand__text strong { font-size: 14.5px; font-weight: 800; }
    .brand__text span { font-size: 11.5px; color: var(--text-muted); }

    .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: transform .25s var(--ease-ios), background .2s, box-shadow .25s, border-color .2s;
    }
    .btn:active { transform: scale(.95); }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(220,38,38,.28); }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: #fff; border-color: var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: #cbd5e1; background: #f8fafc; }
    .btn-lg { padding: 14px 26px; font-size: 15px; }

    /* ---------- Hero ---------- */
    .hero {
        position: relative;
        overflow: hidden;
        padding: 76px 0 64px;
        background:
            radial-gradient(720px 320px at 85% -10%, rgba(220,38,38,.10), transparent 70%),
            radial-gradient(620px 300px at 0% 110%, rgba(37,99,235,.08), transparent 70%);
    }
    .hero__badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--primary-dark);
        background: var(--primary-soft);
        border: 1px solid #fecaca;
        padding: 6px 14px;
        border-radius: 999px;
        margin-bottom: 22px;
        animation: rise .6s var(--ease-ios) both;
    }
    .hero h1 {
        font-size: clamp(30px, 5vw, 50px);
        font-weight: 900;
        max-width: 820px;
        animation: rise .7s var(--ease-ios) both;
    }
    .hero h1 em { font-style: normal; color: var(--primary); }
    .hero__sub {
        margin-top: 20px;
        max-width: 660px;
        font-size: clamp(15px, 2vw, 18px);
        color: var(--text-muted);
        animation: rise .8s var(--ease-ios) both;
    }
    .hero__cta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
        animation: rise .9s var(--ease-ios) both;
    }
    .hero__stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 18px;
        margin-top: 56px;
        animation: rise 1s var(--ease-ios) both;
    }
    .stat {
        background: rgba(255,255,255,.7);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 18px 20px;
    }
    .stat__num { font-size: 26px; font-weight: 900; color: var(--primary-dark); letter-spacing: -.03em; }
    .stat__label { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }

    /* ---------- Section ---------- */
    section { padding: 62px 0; }
    .section__head { max-width: 720px; margin-bottom: 40px; }
    .kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--primary);
        margin-bottom: 12px;
    }
    .section__head h2 { font-size: clamp(24px, 3.6vw, 34px); }
    .section__head p { margin-top: 14px; color: var(--text-muted); font-size: 16px; }

    .grid { display: grid; gap: 20px; }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 26px 24px;
        box-shadow: var(--shadow);
        transition: transform .3s var(--ease-ios), box-shadow .3s, border-color .3s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: #f3d4d4; }
    .card__icon {
        width: 46px; height: 46px;
        border-radius: 13px;
        display: grid; place-items: center;
        margin-bottom: 16px;
    }
    .card__icon svg { width: 23px; height: 23px; }
    .card h3 { font-size: 17px; margin-bottom: 8px; }
    .card p { color: var(--text-muted); font-size: 14px; }

    .ic-red { background: var(--primary-soft); color: var(--primary-dark); }
    .ic-blue { background: var(--blue-soft); color: var(--blue); }
    .ic-amber { background: var(--amber-soft); color: var(--amber); }
    .ic-purple { background: var(--purple-soft); color: var(--purple); }

    /* ---------- Problem/Solution ---------- */
    .ps { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .ps__box { border-radius: var(--radius); padding: 26px 24px; border: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow); }
    .ps__box h3 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
    .ps__box ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 11px; }
    .ps__box li { display: flex; gap: 10px; font-size: 14px; color: var(--text); }
    .ps__box li::before { content: ''; flex: 0 0 auto; width: 8px; height: 8px; margin-top: 8px; border-radius: 999px; background: var(--text-muted); }
    .ps__box--bad li::before { background: #ef4444; }
    .ps__box--good li::before { background: #16a34a; }

    /* ---------- Pricing ---------- */
    .price-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 22px; align-items: stretch; }
    .price {
        position: relative;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 30px 26px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        transition: transform .3s var(--ease-ios), box-shadow .3s;
    }
    .price:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
    .price--featured { border: 2px solid var(--primary); box-shadow: 0 18px 48px rgba(220,38,38,.18); }
    .price__tag {
        position: absolute;
        top: -13px; left: 26px;
        background: var(--primary);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        padding: 5px 12px;
        border-radius: 999px;
        box-shadow: 0 6px 16px rgba(220,38,38,.35);
    }
    .price h3 { font-size: 19px; }
    .price__desc { color: var(--text-muted); font-size: 13.5px; margin-top: 6px; }
    .price__amount { margin: 20px 0 6px; font-size: 30px; font-weight: 900; letter-spacing: -.03em; color: var(--text); }
    .price__amount small { display: block; font-size: 12.5px; font-weight: 500; color: var(--text-muted); letter-spacing: 0; margin-top: 4px; }
    .price__list { list-style: none; margin: 22px 0 26px; padding: 0; display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .price__list li { display: flex; gap: 10px; font-size: 13.5px; }
    .price__list svg { flex: 0 0 auto; width: 17px; height: 17px; margin-top: 3px; color: var(--primary); }
    .price .btn { width: 100%; justify-content: center; }
    .price__note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 26px; }

    /* ---------- Preview Aplikasi ---------- */
    .preview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
    .preview-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        transition: transform .3s var(--ease-ios), box-shadow .3s, border-color .3s;
    }
    .preview-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: #f3d4d4; }
    .preview-img {
        position: relative;
        aspect-ratio: 16/10;
        overflow: hidden;
        background: #f1f5f9;
    }
    .preview-img img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
        transition: transform .5s var(--ease-ios);
    }
    .preview-card:hover .preview-img img { transform: scale(1.04); }
    .preview-caption { padding: 16px 20px 20px; }
    .preview-caption strong { display: block; font-size: 15px; margin-bottom: 4px; }
    .preview-caption span { font-size: 13px; color: var(--text-muted); }
    .preview-badge {
        position: absolute; top: 12px; left: 12px;
        background: rgba(255,255,255,.92);
        backdrop-filter: blur(6px);
        color: var(--primary-dark);
        font-size: 11px; font-weight: 700;
        padding: 4px 10px; border-radius: 999px;
    }

    /* ---------- Steps ---------- */
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; counter-reset: step; }
    .step { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 22px 24px; box-shadow: var(--shadow); }
    .step__num {
        counter-increment: step;
        width: 40px; height: 40px;
        border-radius: 12px;
        display: grid; place-items: center;
        background: var(--primary-soft);
        color: var(--primary-dark);
        font-weight: 900;
        font-size: 16px;
        margin-bottom: 16px;
    }
    .step__num::before { content: counter(step); }
    .step h3 { font-size: 15.5px; margin-bottom: 8px; }
    .step p { font-size: 13.5px; color: var(--text-muted); }

    /* ---------- CTA ---------- */
    .cta {
        background: linear-gradient(135deg, #b91c1c, #dc2626 60%, #ef4444);
        border-radius: 28px;
        padding: 54px 40px;
        color: #fff;
        text-align: center;
        box-shadow: 0 24px 60px rgba(220,38,38,.32);
    }
    .cta h2 { font-size: clamp(24px, 3.6vw, 34px); color: #fff; }
    .cta p { margin-top: 14px; color: rgba(255,255,255,.88); font-size: 16px; }
    .cta__actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 30px; }
    .cta .btn-ghost { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.4); color: #fff; }
    .cta .btn-ghost:hover { background: rgba(255,255,255,.24); }
    .cta .btn-primary { background: #fff; color: var(--primary-dark); }

    footer {
        padding: 40px 0 56px;
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
    }
    footer strong { color: var(--text); }

    .pill-note {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        color: var(--text-muted);
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 14px;
        margin-top: 18px;
    }

    .penawaran-error { max-width: 720px; margin: 80px auto; padding: 28px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); }

    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 640px) {
        section { padding: 46px 0; }
        .hero { padding: 52px 0 44px; }
        .cta { padding: 40px 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
    }
    @media print {
        .topbar, .hero__cta, .price .btn, .cta__actions, .btn { display: none !important; }
        .card, .price, .step, .ps__box { box-shadow: none; }
        body { background: #fff; }
    }
</style>
</head>
<body>

<noscript>
    <div class="wrap"><div class="penawaran-error">
        <h1>Aktifkan JavaScript</h1>
        <p style="margin-top:10px;color:var(--text-muted)">Halaman penawaran ini membutuhkan JavaScript untuk menampilkan isi. Silakan aktifkan JavaScript lalu muat ulang halaman.</p>
    </div></div>
</noscript>

<!-- ======================= TOPBAR ======================= -->
<header class="topbar">
    <div class="wrap topbar__inner">
        <div class="brand">
            <div class="brand__logo" id="brandLogo">WG</div>
            <div class="brand__text">
                <strong id="brandNama">Penawaran</strong>
                <span id="brandSub"></span>
            </div>
        </div>
        <a class="btn btn-primary" href="#kontak" id="topbarCta"></a>
    </div>
</header>

<!-- ======================= HERO ======================= -->
<div class="hero">
    <div class="wrap">
        <span class="hero__badge" id="heroBadge"></span>
        <h1 id="heroJudul"></h1>
        <p class="hero__sub" id="heroSub"></p>
        <div class="hero__cta">
            <a class="btn btn-primary btn-lg" href="#paket" id="heroCtaUtama"></a>
            <a class="btn btn-ghost btn-lg" href="#fitur" id="heroCtaSekunder"></a>
        </div>
        <div class="hero__stats" id="heroStats"></div>
    </div>
</div>

<!-- ======================= MASALAH & SOLUSI ======================= -->
<section id="secMasalah" hidden>
    <div class="wrap">
        <div class="section__head">
            <div class="kicker" id="masalahKicker"></div>
            <h2 id="masalahJudul"></h2>
            <p id="masalahSub"></p>
        </div>
        <div class="ps">
            <div class="ps__box ps__box--bad">
                <h3 id="masalahJudulBox"></h3>
                <ul id="masalahList"></ul>
            </div>
            <div class="ps__box ps__box--good">
                <h3 id="solusiJudulBox"></h3>
                <ul id="solusiList"></ul>
            </div>
        </div>
    </div>
</section>

<!-- ======================= FITUR ======================= -->
<section id="fitur" style="background:#fff; border-top:1px solid var(--border); border-bottom:1px solid var(--border);" hidden>
    <div class="wrap">
        <div class="section__head">
            <div class="kicker" id="fiturKicker"></div>
            <h2 id="fiturJudul"></h2>
            <p id="fiturSub"></p>
        </div>
        <div class="grid grid-3" id="fiturGrid"></div>
    </div>
</section>

<!-- ======================= PREVIEW APLIKASI ======================= -->
<section id="secPreview" style="background:#fff; border-top:1px solid var(--border); border-bottom:1px solid var(--border);" hidden>
    <div class="wrap">
        <div class="section__head">
            <div class="kicker" id="previewKicker"></div>
            <h2 id="previewJudul"></h2>
            <p id="previewSub"></p>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
    </div>
</section>

<!-- ======================= PAKET ======================= -->
<section id="paket" hidden>
    <div class="wrap">
        <div class="section__head">
            <div class="kicker" id="paketKicker"></div>
            <h2 id="paketJudul"></h2>
            <p id="paketSub"></p>
        </div>
        <div class="price-grid" id="priceGrid"></div>
        <p class="price__note" id="paketCatatan"></p>
    </div>
</section>

<!-- ======================= ALUR ======================= -->
<section id="secAlur" style="background:#fff; border-top:1px solid var(--border); border-bottom:1px solid var(--border);" hidden>
    <div class="wrap">
        <div class="section__head">
            <div class="kicker" id="alurKicker"></div>
            <h2 id="alurJudul"></h2>
        </div>
        <div class="steps" id="stepsGrid"></div>
    </div>
</section>

<!-- ======================= KONTAK ======================= -->
<section id="kontak">
    <div class="wrap">
        <div class="cta">
            <h2 id="kontakJudul"></h2>
            <p id="kontakSub"></p>
            <div class="cta__actions">
                <a class="btn btn-primary btn-lg" id="kontakWa" target="_blank" rel="noopener"></a>
                <a class="btn btn-ghost btn-lg" id="kontakEmail"></a>
            </div>
            <span class="pill-note" id="kontakPenyedia" style="background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff;"></span>
        </div>
    </div>
</section>

<footer>
    <div class="wrap">
        <strong id="footerNama"></strong> — <span id="footerSub"></span><br>
        <span id="footerCatatan"></span> &copy; <span id="tahun">2026</span>.
    </div>
</footer>

<script src="penawaran-data.js?v=2"></script>

    var WARNA = { red: 'ic-red', blue: 'ic-blue', amber: 'ic-amber', purple: 'ic-purple' };

    function svg(name, cls, sw) {
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 2) +
            '" stroke-linecap="round" stroke-linejoin="round"' + (cls ? ' class="' + cls + '"' : '') + '>' +
            (IKON[name] || IKON.dashboard) + '</svg>';
    }
    function el(id) { return document.getElementById(id); }
    function isi(id, teks) { var n = el(id); if (n) { n.innerHTML = teks == null ? '' : teks; } }
    function teks(id, nilai) { var n = el(id); if (n) { n.textContent = nilai == null ? '' : nilai; } }
    function daftar(id, arr) {
        var box = el(id); if (!box) { return; }
        box.innerHTML = (arr || []).map(function (t) { return '<li>' + t + '</li>'; }).join('');
    }

    /* ---------- Pilih klien dari URL ---------- */
    var KLIEN = window.PENAWARAN_CLIENTS || {};
    var params = new URLSearchParams(window.location.search);
    var kunci = params.get('klien') || params.get('client') || window.PENAWARAN_DEFAULT;
    var cfg = KLIEN[kunci] || KLIEN[window.PENAWARAN_DEFAULT] || KLIEN[Object.keys(KLIEN)[0]];

    if (!cfg) {
        document.body.innerHTML = '<div class="penawaran-error"><h1>Data penawaran belum tersedia</h1>' +
            '<p style="margin-top:10px;color:var(--text-muted)">Periksa file <strong>penawaran-data.js</strong> — pastikan daftar klien (PENAWARAN_CLIENTS) sudah diisi.</p></div>';
        return;
    }

    /* ---------- Meta & identitas ---------- */
    var meta = cfg.meta || {};
    document.title = meta.title || 'Penawaran';
    var md = el('metaDesc'); if (md) { md.setAttribute('content', meta.description || ''); }

    var brand = cfg.brand || {};
    teks('brandLogo', brand.logoText || '');
    teks('brandNama', brand.nama || '');
    teks('brandSub', brand.sub || '');

    var cta = el('topbarCta');
    if (cta) {
        cta.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg> ' + (cfg.topbarCta || 'Hubungi Kami');
    }

    /* ---------- Hero ---------- */
    var hero = cfg.hero || {};
    isi('heroBadge', '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg> ' + (hero.badge || ''));
    isi('heroJudul', hero.judul || '');
    isi('heroSub', hero.sub || '');
    var utama = el('heroCtaUtama'), sekunder = el('heroCtaSekunder');
    if (utama) { utama.innerHTML = (hero.ctaUtama || 'Lihat Paket') + ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'; }
    if (sekunder) { sekunder.textContent = hero.ctaSekunder || 'Jelajahi Fitur'; }
    isi('heroStats', (hero.stats || []).map(function (s) {
        return '<div class="stat"><div class="stat__num">' + s.num + '</div><div class="stat__label">' + s.label + '</div></div>';
    }).join(''));

    /* ---------- Masalah & Solusi ---------- */
    if (cfg.masalah || cfg.solusi) {
        el('secMasalah').hidden = false;
        var m = cfg.masalah || {}, s = cfg.solusi || {};
        teks('masalahKicker', m.kicker || 'Mengapa Sistem Ini');
        isi('masalahJudul', m.judul || '');
        isi('masalahSub', m.sub || '');
        isi('masalahJudulBox', '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ' + (m.judulBox || 'Tantangan umum'));
        daftar('masalahList', m.list);
        isi('solusiJudulBox', '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ' + (s.judulBox || 'Dengan sistem ini'));
        daftar('solusiList', s.list);
    }

    /* ---------- Fitur ---------- */
    if (cfg.fitur && (cfg.fitur.items || []).length) {
        el('fitur').hidden = false;
        teks('fiturKicker', cfg.fitur.kicker || 'Fitur Unggulan');
        isi('fiturJudul', cfg.fitur.judul || '');
        isi('fiturSub', cfg.fitur.sub || '');
        isi('fiturGrid', cfg.fitur.items.map(function (f) {
            return '<article class="card">' +
                '<div class="card__icon ' + (WARNA[f.warna] || 'ic-red') + '">' + svg(f.icon, null, 2) + '</div>' +
                '<h3>' + f.judul + '</h3><p>' + f.desc + '</p></article>';
        }).join(''));
    }

    /* ---------- Paket ---------- */
    if (cfg.paket && (cfg.paket.items || []).length) {
        el('paket').hidden = false;
        teks('paketKicker', cfg.paket.kicker || 'Paket & Investasi');
        isi('paketJudul', cfg.paket.judul || '');
        isi('paketSub', cfg.paket.sub || '');
        var centang = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        var adaFeatured = false;
        isi('priceGrid', cfg.paket.items.map(function (p) {
            var lis = (p.fitur || []).map(function (t) { return '<li>' + centang + t + '</li>'; }).join('');
            var featId = '';
            if (p.featured) { adaFeatured = true; featId = ' id="paket-rekomendasi"'; }
            return '<div class="price' + (p.featured ? ' price--featured' : '') + '"' + featId + '>' +
                (p.tag ? '<span class="price__tag">' + p.tag + '</span>' : '') +
                '<h3>' + p.nama + '</h3>' +
                (p.desc ? '<div class="price__desc">' + p.desc + '</div>' : '') +
                '<div class="price__amount">' + (p.harga || 'Rp —') + '<small>' + (p.satuan || '') + '</small></div>' +
                '<ul class="price__list">' + lis + '</ul>' +
                '<a class="btn ' + (p.featured ? 'btn-primary' : 'btn-ghost') + '" href="#kontak">Pilih ' + p.nama + '</a>' +
                '</div>';
        }).join(''));
        teks('paketCatatan', cfg.paket.catatan || '');
        /* Arahkan tombol "Lihat Paket" ke paket rekomendasi (featured) */
        var btnPaket = el('heroCtaUtama');
        if (btnPaket) { btnPaket.href = adaFeatured ? '#paket-rekomendasi' : '#paket'; }
    }

    /* ---------- Preview Aplikasi ---------- */
    if (cfg.preview && (cfg.preview.items || []).length) {
        el('secPreview').hidden = false;
        teks('previewKicker', cfg.preview.kicker || 'Tampilan Aplikasi');
        isi('previewJudul', cfg.preview.judul || '');
        isi('previewSub', cfg.preview.sub || '');
        isi('previewGrid', cfg.preview.items.map(function (p) {
            return '<figure class="preview-card">' +
                '<div class="preview-img">' +
                    (p.badge ? '<span class="preview-badge">' + p.badge + '</span>' : '') +
                    '<img src="' + p.img + '" alt="' + (p.judul || '') + '" loading="lazy">' +
                '</div>' +
                '<figcaption class="preview-caption"><strong>' + (p.judul || '') + '</strong><span>' + (p.desc || '') + '</span></figcaption>' +
                '</figure>';
        }).join(''));
    }

    /* ---------- Alur ---------- */
    if (cfg.alur && (cfg.alur.items || []).length) {
        el('secAlur').hidden = false;
        teks('alurKicker', cfg.alur.kicker || 'Alur Implementasi');
        isi('alurJudul', cfg.alur.judul || '');
        isi('stepsGrid', cfg.alur.items.map(function (a) {
            return '<div class="step"><div class="step__num"></div><h3>' + a.judul + '</h3><p>' + a.desc + '</p></div>';
        }).join(''));
    }

    /* ---------- Kontak & penyedia ---------- */
    var pen = Object.assign({}, window.PENAWARAN_PENYEDIA || {}, cfg.penyedia || {});
    var k = cfg.kontak || {};
    isi('kontakJudul', k.judul || '');
    isi('kontakSub', k.sub || '');
    var wa = el('kontakWa');
    if (wa) {
        wa.href = pen.waLink || '#';
        wa.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg> ' + (k.ctaUtama || 'Chat WhatsApp');
    }
    var em = el('kontakEmail');
    if (em) { em.href = 'mailto:' + (pen.email || ''); em.textContent = k.ctaSekunder || 'Kirim Email'; }
    teks('kontakPenyedia', 'Nama Penyedia: ' + (pen.nama || '') + '  ·  Telp/WA: ' + (pen.wa || '') + '  ·  ' + (pen.email || ''));

    /* ---------- Footer ---------- */
    var f = cfg.footer || {};
    teks('footerNama', f.nama || brand.nama || '');
    teks('footerSub', f.sub || brand.sub || '');
    teks('footerCatatan', f.catatan || '');
    teks('tahun', new Date().getFullYear());
})();
</script>
</body>
</html>
